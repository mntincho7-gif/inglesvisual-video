<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Un mensaje para ti · Inglés Visual</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --fondo: #FAFAF7;
    --texto: #172223;
    --petroleo: #123C3E;
    --coral: #FF6B5C;
    --gris: #5C6663;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .logo { width: 56px; height: 56px; }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 68vh;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 8px 28px rgba(18, 60, 62, .18);
  }
  .video video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sonido {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    border: 0;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font: 700 16px/1 inherit;
    font-family: inherit;
    padding: 12px 18px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    white-space: nowrap;
  }
  .sonido[hidden] { display: none; }
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: var(--coral);
    color: #fff;
    font-weight: 800;
    font-size: 19px;
    padding: 18px 16px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(255, 107, 92, .35);
  }
  .nota { font-size: 14px; color: var(--gris); text-align: center; line-height: 1.45; }
  .nota b { color: var(--petroleo); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Inglés Visual">

  <div class="video">
    <video id="v" src="mensaje.mp4" poster="portada.jpg" autoplay muted playsinline loop preload="auto"></video>
    <button class="sonido" id="sonido" type="button">🔊 Toca para escucharla</button>
  </div>

  <a class="cta" id="cta" href="https://www.inglesvisual.site/">Quiero mis mapas al 50 %</a>

  <p class="nota">El 50 % ya está aplicado en tu carrito.<br>
    <b>Pago único · acceso para siempre · 7 días de garantía</b></p>
</main>

<script>
  // El link del carrito llega después del «#» (lo pone Brevo: ...#{{ params.cart_url }}).
  // Solo se acepta un link https de la tienda; si no, el botón va a la landing.
  (function () {
    var bruto = location.hash.slice(1);
    if (/^https?%3A/i.test(bruto)) {
      try { bruto = decodeURIComponent(bruto); } catch (e) {}
    }
    try {
      var u = new URL(bruto);
      var h = u.hostname;
      var permitido = /(^|\.)inglesvisual\.site$/.test(h) || /(^|\.)impultienda\.(ar|com)$/.test(h);
      if (u.protocol === "https:" && permitido) {
        document.getElementById("cta").href = u.href;
      }
    } catch (e) {}

    var v = document.getElementById("v");
    var boton = document.getElementById("sonido");
    function conSonido() {
      v.muted = false;
      v.loop = false;
      v.currentTime = 0;
      v.play();
      boton.hidden = true;
    }
    boton.addEventListener("click", conSonido);
    v.addEventListener("click", function () { if (v.muted) conSonido(); });
  })();
</script>
</body>
</html>
